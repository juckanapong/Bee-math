<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ไม่พบหน้านี้ · BeeMath</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/Bee-math/icons/icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- GitHub Pages แสดงหน้านี้เมื่อเปิดลิงก์ที่ไม่มีอยู่ (ลิงก์พิมพ์ผิด/ลิงก์เก่า) · ใช้ที่อยู่เต็มเพราะหน้านี้อาจถูกเปิดจาก path ไหนก็ได้ -->
  <style>
    :root { --bg: #FFF8E6; --ink: #2A1F14; --ink-2: #6B5B45; --honey: #FFC21A; --honey-dark: #E09A00; --honey-light: #FFE08A; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: Anuphan, system-ui, sans-serif; text-align: center; }
    main { padding: 24px 20px; max-width: 26em; }
    .hex { width: 120px; height: 134px; margin: 0 auto 8px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--honey-light); }
    h1 { font-family: Mitr, sans-serif; font-weight: 600; font-size: 28px; margin: 12px 0 6px; }
    p { margin: 0 0 22px; color: var(--ink-2); line-height: 1.6; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 18px; background: var(--honey); border-bottom: 5px solid var(--honey-dark); color: var(--ink); font-family: Mitr, sans-serif; font-size: 18px; font-weight: 500; text-decoration: none; }
    a:focus-visible { outline: 3px solid #2F6FED; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="hex"><img src="/Bee-math/icons/icon.svg" width="84" height="84" alt=""></div>
    <h1>ไม่พบหน้านี้</h1>
    <p>ลิงก์อาจพิมพ์ผิด หรือหน้านี้ย้ายไปแล้ว กลับไปเรียนต่อกับน้องผึ้งได้เลย</p>
    <a href="https://juckanapong.github.io/Bee-math/">กลับไปที่ BeeMath</a>
  </main>
</body>
</html>
